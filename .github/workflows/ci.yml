name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ogma
    steps:
      - uses: actions/checkout@v5
        with:
          path: Ogma
      # Ogma imports the private sibling repo Harmonia (../Harmonia); read-only deploy key.
      - uses: actions/checkout@v5
        with:
          repository: alainritter/Harmonia
          ssh-key: ${{ secrets.HARMONIA_DEPLOY_KEY }}
          path: Harmonia
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: Ogma/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Ogma/pnpm-lock.yaml
      # Electron/Playwright browser binaries aren't needed to typecheck or lint.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm format:check
      # Typechecks frontend AND server, then builds the production bundle.
      - run: pnpm build
